sonar.projectKey=jwill9999_agent-platform-deepagents
sonar.organization=jwill9999
sonar.host.url=https://sonarcloud.io

# Explicit ownership scope: application source and CI; tests are classified separately.
sonar.scanner.autoconfig.enabled=false
sonar.sources=apps,packages,.github
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Report the real quality gate; do not manufacture coverage or suppress failures.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
